<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Jogo de Soma - EJB</title>
    </h:head>
    <h:body>
        <f:metadata>
            <f:viewAction action="#{jogoBean.prepararNovaRodada}" onPostback="false"/>
        </f:metadata>

        <h:form>
            <div>
                <h:outputLabel value="Informe seu nome: " />
                <h:inputText value="#{jogoBean.nome}" />
            </div>
            <br/>

            <div>
                <h:outputLabel value="Quanto é: #{jogoBean.numero1} + #{jogoBean.numero2} = " />
                <h:inputText value="#{jogoBean.respostaUsuario}" />
                <h:commandButton value="Verificar" action="#{jogoBean.verificarResposta}" />
            </div>
            <br/>

            <h:outputText value="#{jogoBean.mensagemFeedback}" style="font-weight: bold; color: blue;" />
            <hr/>

            <h3>===== Ranking Atual =====</h3>
            <ol>
                <ui:repeat value="#{jogoBean.rankingAtual.entrySet().toArray()}" var="entry">
                    <li>#{entry.key} - #{entry.value} pontos</li>
                </ui:repeat>
            </ol>
        </h:form>
    </h:body>
</html>
